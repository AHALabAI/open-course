<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>AHALab · 讲者窗</title>
<style>
:root{--bg:#202a26;--paper:#2d3a32;--ink:#f5f1e8;--muted:#c1c9b8;--line:#566351;--accent:#e2b671}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.55}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);gap:24px}h1{font-size:18px;margin:0}#connection{font-size:12px;color:var(--muted)}button,select{font:inherit;cursor:pointer;border:1px solid #6d7c62;background:#354638;color:var(--ink);border-radius:4px;padding:8px 14px}button:hover{background:#465849}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #e5b274;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(350px,.85fr) minmax(480px,1.15fr);gap:24px;padding:24px}.left{min-width:0}.preview-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}.preview{aspect-ratio:16/9;overflow:hidden;position:relative;background:#1c2520;margin-bottom:20px;border:1px solid var(--line)}.preview iframe{width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none}.preview.next{max-width:78%}.timer-panel{display:flex;gap:28px;align-items:center;margin:24px 0 12px}.timer-panel strong{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}.timer-panel small{display:block;font-size:12px;color:var(--muted)}.timer-panel .overtime{color:#ffbaa6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button{font-size:13px}.notes{min-width:0}.notes h2{font-size:25px;font-weight:600;margin:0 0 22px}.note{margin:0 0 20px}.note h3{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin:0 0 8px}.note p{white-space:pre-line;margin:0;font-size:16px;line-height:1.9;overflow-wrap:anywhere}.note.say{padding:18px 22px;background:#2f3d32;border-radius:4px}.note.say h3{color:var(--accent)}.note.say p{font-size:22px;color:#f5f1e8;line-height:1.85}.note.cue p{color:#c1c9b8;font-size:15px}.source-detail{border-top:1px solid var(--line);padding-top:14px;margin-top:20px;font-size:13px}.source-detail summary{cursor:pointer;color:var(--muted)}.source-detail p{font-size:13px;white-space:pre-line;overflow-wrap:anywhere}a{color:#efddb5;text-underline-offset:3px}#agenda{width:100%;margin:12px 0;font-size:13px}#motion{font-size:12px;color:var(--muted)}.empty{padding:36px;text-align:left;color:var(--muted)}.footer-help{font-size:12px;color:var(--muted);padding:0 24px 24px}#fontSize{width:100px}label{font-size:12px;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}.preview.next{max-width:60%}.note.say p{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.preview-pair{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}.preview-pair>div{min-width:0}.preview.next{max-width:100%}.preview-label{min-height:46px;align-items:flex-start;gap:12px}.preview-label #next-title{font-size:12px;max-width:160px;text-align:right}.preview{margin-bottom:8px}.notes{max-height:calc(100dvh - 150px);overflow:auto;padding-right:12px;scrollbar-color:#7690a5 #202a26}.left{align-self:start}.layout{padding-bottom:12px}.footer-help{max-width:720px}.timer-panel{margin-top:20px}.note.say p{font-size:22px}@media(max-width:950px){.notes{max-height:none;overflow:visible;padding:0}.preview-pair{grid-template-columns:1fr 1fr}.preview.next{max-width:100%}}

.context-panel{border:1px solid var(--line);padding:14px 16px;margin:14px 0;background:#10283b}.context-panel[hidden]{display:none}.context-panel h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 8px}.pitch-live{display:flex;justify-content:space-between;align-items:center}.pitch-live strong{font:36px Bahnschrift,Arial,sans-serif;color:#85c8eb}.context-panel button[aria-pressed=true]{background:#85c8eb;color:#081c2c}.context-panel p{font-size:12px;color:var(--muted);margin:6px 0}.context-panel .actions{margin:8px 0 0}
</style></head><body>
<header><div><h1>AHALab · 讲者窗</h1><span id="connection" role="status">正在连接课件主窗口…</span></div><label>讲稿字号 <input aria-label="讲稿字号" id="fontSize" max="32" min="18" type="range" value="22"/></label></header>
<div class="layout"><div class="left"><div class="preview-pair"><div><div class="preview-label"><span>当前投影</span><span id="position"></span></div><div class="preview" id="current"><iframe sandbox="allow-same-origin" title="当前页预览"></iframe></div></div><div><div class="preview-label"><span>下一页</span><span id="next-title"></span></div><div class="preview next" id="next"><iframe sandbox="allow-same-origin" title="下一页预览"></iframe></div></div></div><div class="actions"><button data-command="prev">← 上一页</button><button data-command="next">下一页 →</button></div><select aria-label="按议程跳转" id="agenda"></select><div class="timer-panel"><div><strong id="pageTime">00:00</strong><small id="planned">本页用时</small></div><div><strong id="totalTime">00:00</strong><small>累计用时</small></div></div><div class="actions"><button data-command="timer" data-value="toggle" id="timerToggle">开始计时</button><button data-command="timer" data-value="reset-page">本页清零</button><button data-command="timer" data-value="reset-all">整课清零</button></div><div class="actions"><button data-command="replay" id="replay">重播演示</button><button data-command="motion-pause" id="pauseMotion">暂停演示</button><button data-command="motion-off" id="motionOff">切换静态</button></div><p id="motion"></p><section class="context-panel" hidden="" id="factPanel"><h3>开场 · 点一下揭晓，再点收起</h3><div class="actions"><button data-fact-command="0">① 二氧化碳</button><button data-fact-command="1">② 夜间发电</button><button data-fact-command="2">③ AI预报</button></div></section><section class="context-panel" hidden="" id="pitchPanel"><div class="pitch-live"><h3 id="pitchLabel">小组展示</h3><strong id="pitchTime">03:00</strong></div><div class="actions"><button data-pitch-select="1">第1组</button><button data-pitch-select="2">第2组</button><button data-pitch-select="3">第3组</button><button data-pitch-select="4">第4组</button></div><div class="actions"><button data-pitch-control="toggle" id="pitchToggle">开始本组</button><button data-pitch-control="reset">本组清零</button></div><p>3分钟讲述 → 1分钟反馈。各组单独计时，由你选择下一组。</p></section></div><main class="notes"><h2 id="title">从课件主窗口按 S 打开</h2><div id="notes"><p class="empty">请保留课件主窗口。连接后，这里显示逐页讲稿与操作提示；学生投影不会显示这些内容。</p></div></main></div><p class="footer-help">将此窗口拖到教师屏幕，课件主窗口放到投影屏幕。方向键翻页；空格下一页。开始计时后，切页只重置本页用时，累计时间继续；小组展示另有独立倒计时，换组或离开展示页会暂停当前组。</p>
<script src="speaker-window.inline-0.js"></script></body></html>
