<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 你分得出吗？</title>
<script src="qrcode.js"></script>
<style>
  :root{
    --ink:#0d1417;--ink-2:#13201f;--ink-3:#0c1614;--paper:#ece6da;--paper-dim:#a9b0ab;--muted:#6f7d7c;
    --zima:#22d3d9;--zima-deep:#0f8f95;--amber:#e0a24c;--line:#26332f;--ok:#46d6a0;--no:#e0685f;
    --serif:"Songti SC","STSong","Noto Serif SC",serif;
    --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);line-height:1.6;
    background-image:radial-gradient(55% 45% at 85% 4%, rgba(34,211,217,.08), transparent 70%);}
  button{font-family:var(--sans);cursor:pointer}
  input,select,textarea{font-family:var(--sans)}
  :focus-visible{outline:2px solid var(--zima);outline-offset:2px;border-radius:8px}

  /* 登录 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{width:100%;max-width:360px}
  .lk{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--zima);margin:0 0 14px}
  .lcard h1{font-family:var(--serif);font-size:34px;margin:0 0 6px}
  .lcard p.s{color:var(--paper-dim);font-size:14px;margin:0 0 26px}
  .fld{margin:0 0 14px}
  label{display:block;font-size:13px;color:var(--paper-dim);margin:0 0 7px}
  input,select,textarea{width:100%;background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
    font-size:15px;padding:12px 14px;border-radius:11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--zima)}
  textarea{font-family:var(--mono);font-size:13.5px;line-height:1.6;resize:vertical;min-height:78px}
  .btn-go{background:linear-gradient(120deg,var(--amber),var(--zima));color:#08110f;border:none;border-radius:11px;font-weight:600;font-size:15px;padding:13px 18px;width:100%}
  .btn-go:hover{filter:brightness(1.06)}
  .err{color:var(--no);font-size:13.5px;margin:10px 0 0;min-height:18px}

  /* 后台框架 */
  #app{display:none}
  header{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(13,20,23,.92);backdrop-filter:blur(8px);z-index:5}
  header .brand{font-family:var(--serif);font-size:18px;white-space:nowrap}
  .tabs{display:flex;gap:6px}
  .tab{background:transparent;border:1px solid var(--line);color:var(--paper-dim);border-radius:999px;padding:7px 16px;font-size:14px}
  .tab.on{color:#08110f;background:linear-gradient(120deg,var(--amber),var(--zima));border-color:transparent;font-weight:600}
  header .sp{margin-left:auto}
  .gbtn{background:transparent;border:1px solid var(--line);color:var(--paper-dim);border-radius:9px;padding:8px 14px;font-size:13.5px}
  .gbtn:hover{color:var(--paper);border-color:#3a4b46}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 70px}
  .h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);margin:22px 0 12px}
  .btn-save{background:linear-gradient(120deg,var(--amber),var(--zima));color:#08110f;border:none;border-radius:10px;padding:11px 22px;font-weight:600}

  /* —— 控场 —— */
  .ctl{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ctl .durwrap{display:flex;align-items:center;gap:8px}
  .ctl .durwrap input{width:90px;text-align:center;font-family:var(--mono)}
  .ctl .preset{display:flex;gap:6px}
  .ctl .preset button{background:transparent;border:1px solid var(--line);color:var(--paper-dim);border-radius:8px;padding:7px 11px;font-size:12.5px}
  .ctl .preset button:hover{color:var(--paper);border-color:var(--zima)}
  .ctl .start{background:linear-gradient(120deg,var(--amber),var(--zima));color:#08110f;border:none;border-radius:10px;padding:11px 20px;font-weight:600}
  .ctl .end{background:transparent;border:1px solid var(--no);color:var(--no);border-radius:10px;padding:11px 18px}
  .statuspill{margin-left:auto;display:flex;align-items:center;gap:14px}
  .statuspill .st{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--paper-dim)}
  .statuspill .st.run{color:var(--zima);border-color:var(--zima-deep)}
  .statuspill .st.end{color:var(--amber);border-color:rgba(224,162,76,.5)}
  .statuspill .cd{font-family:var(--mono);font-size:24px;font-weight:700}
  .statuspill .cd.warn{color:var(--no)}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card .big{font-family:var(--serif);font-size:34px;line-height:1}
  .card .lbl{font-size:12.5px;color:var(--paper-dim);margin-top:4px}
  .card.j .big{color:var(--paper)} .card.f .big{color:var(--ok)} .card.p .big{color:var(--amber)}
  .notf{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;color:var(--paper-dim)}
  .notf b{color:var(--paper)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-family:var(--serif);font-size:13.5px;background:rgba(224,162,76,.1);border:1px solid rgba(224,162,76,.3);color:var(--amber);border-radius:999px;padding:3px 10px}

  /* 每题作答 */
  .qstat{display:flex;align-items:center;gap:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .qstat .ord{font-family:var(--mono);font-size:13px;color:var(--paper-dim);min-width:22px}
  .qstat .qp{flex:1;min-width:0}
  .qstat .qp .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qstat .qp .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .dist{display:flex;height:9px;width:200px;border-radius:5px;overflow:hidden;background:var(--ink-3);flex:none}
  .dist i{display:block;height:100%}
  .dist .h{background:var(--amber)} .dist .a{background:var(--zima)} .dist .b{background:linear-gradient(90deg,var(--amber),var(--zima))}
  .qstat .num{font-family:var(--mono);font-size:12px;color:var(--paper-dim);min-width:78px;text-align:right}
  .qstat .acc{font-family:var(--mono);font-size:13px;min-width:54px;text-align:right;color:var(--ok)}
  .legend{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:14px;margin:2px 0 10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}

  /* 排名 */
  .rank .row{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;font-size:16px;margin-bottom:7px;background:var(--ink-2);border:1px solid var(--line)}
  .rank .row.t1{border-color:rgba(224,162,76,.5);background:rgba(224,162,76,.06)}
  .rank .rk{font-family:var(--mono);font-size:15px;color:var(--paper-dim);min-width:30px;text-align:center}
  .rank .row.top .rk{font-size:19px}
  .rank .nm{font-family:var(--serif)}
  .rank .sc{margin-left:auto;font-family:var(--mono);color:var(--zima)}
  .rank .fin{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:10px}
  .empty{color:var(--muted);font-family:var(--serif);padding:14px 0}

  /* 题库（沿用）*/
  .bankhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .bankhead h2b{font-family:var(--serif);font-size:24px}
  .bankbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .qlist{display:flex;flex-direction:column;gap:10px}
  .qitem{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
  .qord{font-family:var(--mono);color:var(--paper-dim);font-size:13px;min-width:24px;padding-top:3px}
  .qmain{flex:1;min-width:0}
  .qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
  .qround{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--zima);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .badge{font-size:11px;border-radius:999px;padding:3px 9px;font-weight:600}
  .badge.h{background:rgba(224,162,76,.16);color:var(--amber)}
  .badge.a{background:rgba(34,211,217,.14);color:var(--zima)}
  .badge.b{background:linear-gradient(120deg,rgba(224,162,76,.18),rgba(34,211,217,.18));color:var(--paper)}
  .kind{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .qprompt{font-weight:600;font-size:15.5px}
  .qbody{color:var(--paper-dim);font-size:13.5px;margin-top:3px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .qacts{display:flex;gap:8px;flex:none}
  .mini{background:transparent;border:1px solid var(--line);color:var(--paper-dim);border-radius:8px;padding:6px 12px;font-size:13px}
  .mini:hover{color:var(--paper);border-color:#3a4b46}
  .mini.del:hover{color:var(--no);border-color:var(--no)}
  .editor{background:var(--ink-2);border:1px solid var(--zima-deep);border-radius:16px;padding:20px;margin-bottom:20px;display:none}
  .editor.on{display:block}
  .editor h3e{font-family:var(--serif);font-size:19px;display:block;margin-bottom:16px}
  .row3{display:grid;grid-template-columns:110px 1fr 160px;gap:12px;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .ed-acts{display:flex;gap:10px;margin-top:18px}
  .btn-cancel{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:10px;padding:11px 20px}
  .mediafield,.linkfield{display:none}
  .uploadrow{display:none;align-items:center;gap:12px;margin-top:9px}
  .uploadbtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--paper-dim);background:transparent;border:1px dashed var(--zima-deep);border-radius:9px;padding:8px 14px;cursor:pointer}
  .uploadbtn:hover{color:var(--paper);border-color:var(--zima)}
  .ustat{font-size:13px;color:var(--paper-dim)}

  /* —— 投屏（全屏，按状态切换）—— */
  #present{display:none;position:fixed;inset:0;z-index:40;background:var(--ink);
    background-image:radial-gradient(55% 45% at 80% 6%, rgba(34,211,217,.10), transparent 70%),radial-gradient(50% 40% at 8% 95%, rgba(224,162,76,.07), transparent 70%);}
  body.present #present{display:flex}
  body.present header,body.present main{display:none}
  .exit-present{display:none;position:fixed;top:14px;right:14px;z-index:50}
  body.present .exit-present{display:block}
  .pwrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vmin;text-align:center}
  .ptitle{font-family:var(--serif);font-size:6vmin;margin:0 0 2vmin}
  .pqr{width:42vmin;height:42vmin;background:#fff;border-radius:2.4vmin;padding:2vmin;display:flex;align-items:center;justify-content:center}
  .pqr svg{width:100%;height:100%;display:block}
  .purl{margin-top:2.4vmin;font-family:var(--mono);font-size:2.6vmin;background:var(--ink-2);border:1px solid var(--line);border-radius:1.2vmin;padding:1.2vmin 2.4vmin}
  .purl b{color:var(--zima)}
  .pjoined{margin-top:2vmin;font-family:var(--serif);font-size:3vmin;color:var(--paper-dim)}
  .pcd{font-family:var(--mono);font-size:18vmin;font-weight:700;line-height:1}
  .pcd.warn{color:var(--no)}
  .pprog{font-family:var(--serif);font-size:4vmin;color:var(--paper-dim);margin-top:2vmin}
  .pbar{width:64vmin;max-width:88vw;height:1.6vmin;background:var(--line);border-radius:1vmin;overflow:hidden;margin-top:2.4vmin}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--zima),var(--amber))}
  .prank{width:min(70vmin,92vw)}
  .prank .row{display:flex;align-items:center;gap:2.4vmin;padding:1.5vmin 2vmin;border-bottom:1px solid var(--line);font-size:3.4vmin}
  .prank .row.t1 .rk,.prank .row.t1 .sc{color:var(--amber)}
  .prank .rk{font-family:var(--mono);min-width:5vmin}
  .prank .nm{font-family:var(--serif)}
  .prank .sc{margin-left:auto;font-family:var(--mono);color:var(--zima)}

  @media(max-width:820px){
    .cards{grid-template-columns:1fr 1fr}
    .row3,.grid2{grid-template-columns:1fr}
    .dist{width:120px}
    header{flex-wrap:wrap}
  }
</style>
</head>
<body>

<!-- 登录 -->
<section id="login">
  <div class="lcard">
    <p class="lk">齐码蓝 · 智能简史</p>
    <h1>管理后台</h1>
    <p class="s">登录后可控场（设时长、开始计时、看实时作答与排名）并管理题目。</p>
    <div class="fld"><label for="u">用户名</label><input id="u" autocomplete="username"></div>
    <div class="fld"><label for="p">密码</label><input id="p" type="password" autocomplete="current-password"></div>
    <button class="btn-go" id="loginBtn">登录</button>
    <p class="err" id="lerr"></p>
    <p class="s" style="margin-top:18px;font-size:12.5px;color:var(--muted)">首次运行的默认账号密码，会打印在启动 server.py 的终端里，也写在同目录的 .env 文件中。</p>
  </div>
</section>

<!-- 后台 -->
<section id="app">
  <button class="gbtn exit-present" id="exitPresent">退出投屏</button>
  <header>
    <span class="brand">你分得出吗 · 后台</span>
    <div class="tabs">
      <button class="tab on" data-tab="control">控场</button>
      <button class="tab" data-tab="bank">题库管理</button>
    </div>
    <span class="sp"></span>
    <button class="gbtn" id="presentBtn">进入投屏</button>
    <button class="gbtn" id="logoutBtn">退出登录</button>
  </header>
  <main>
    <!-- 控场 -->
    <div id="view-control">
      <div class="ctl">
        <div class="durwrap"><label style="margin:0">答题时长(秒)</label><input id="dur" type="number" min="10" value="180"></div>
        <div class="preset">
          <button data-sec="60">1分钟</button><button data-sec="120">2分钟</button>
          <button data-sec="180">3分钟</button><button data-sec="300">5分钟</button>
        </div>
        <button class="start" id="startRound">开始本轮</button>
        <button class="end" id="endRound">结束本轮</button>
        <button class="gbtn" id="resetRound">重置</button>
        <div class="statuspill">
          <span class="st" id="stPill">空闲</span>
          <span class="cd" id="cd">--:--</span>
        </div>
      </div>

      <div class="cards">
        <div class="card j"><div class="big" id="cJoined">0</div><div class="lbl">已加入</div></div>
        <div class="card f"><div class="big" id="cFin">0</div><div class="lbl">已答完</div></div>
        <div class="card p"><div class="big" id="cProg">0</div><div class="lbl">答题中 / 未答完</div></div>
      </div>
      <div class="notf">未答完：<span id="notf"><b>—</b></span><div class="chips" id="notfChips"></div></div>

      <p class="h2">每道题的作答情况（实时）</p>
      <div class="legend"><span><i style="background:var(--amber)"></i>人</span><span><i style="background:var(--zima)"></i>AI</span><span><i style="background:linear-gradient(90deg,var(--amber),var(--zima))"></i>一起</span><span>正确率</span></div>
      <div id="qstats"></div>

      <p class="h2">排名（实时 / 结束后定格）</p>
      <div class="rank" id="rankList"></div>

      <div style="margin-top:18px"><button class="btn-save" id="presentBtn2">进入投屏（全屏）</button></div>
    </div>

    <!-- 题库管理 -->
    <div id="view-bank" style="display:none">
      <div class="bankhead">
        <h2b>题库管理</h2b>
        <div class="bankbtns">
          <button class="gbtn" id="exportBtn">导出备份</button>
          <button class="gbtn" id="importBtn">导入备份</button>
          <button class="gbtn" id="seedBtn">恢复默认</button>
          <button class="btn-save" id="newBtn">+ 新增一题</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </div>
      <div class="editor" id="editor">
        <h3e id="edTitle">新增一题</h3e>
        <div class="row3">
          <div><label>顺序</label><input id="f_ord" type="number" value="0"></div>
          <div><label>分组标签</label><input id="f_round" list="rounds" placeholder="如：文字 · 真伪"></div>
          <div><label>题型</label>
            <select id="f_kind">
              <option value="text">文字</option><option value="code">代码</option><option value="image">图片</option>
              <option value="audio">音频</option><option value="video">视频</option>
              <option value="embed">网页嵌入</option><option value="product">产品 / 应用</option>
            </select>
          </div>
        </div>
        <datalist id="rounds"><option value="文字 · 真伪"><option value="图像 · 影像"><option value="声音 · 音乐"><option value="影视 · 短片"><option value="程序 · 代码"><option value="产品 · 应用"></datalist>
        <div class="fld"><label>题干（问句）</label><input id="f_prompt" placeholder="如：这段话，是谁写的？"></div>
        <div class="fld"><label id="bodylabel">正文</label><textarea id="f_body" placeholder="题目正文 / 代码 / 产品描述"></textarea></div>
        <div class="fld mediafield" id="mediafield">
          <label id="medialabel">媒体地址</label>
          <input id="f_media" placeholder="填一个在线地址，或点下面「上传本地文件」">
          <div class="uploadrow" id="uploadrow">
            <label class="uploadbtn">⬆ 上传本地文件<input type="file" id="f_file" accept="image/*,audio/*,video/*" hidden></label>
            <span class="ustat" id="ustat"></span>
          </div>
        </div>
        <div class="fld linkfield" id="linkfield"><label>外部链接（可选，给产品/嵌入用，会显示「打开看看」按钮）</label><input id="f_link" placeholder="https://..."></div>
        <div class="grid2">
          <div><label>正确答案</label>
            <select id="f_answer"><option value="h">人 做的</option><option value="a">AI 做的</option><option value="b">人和 AI 一起</option></select>
          </div>
          <div><label>出处（可选）</label><input id="f_src" placeholder="如：—— 某作者"></div>
        </div>
        <div class="fld"><label>揭晓解说（尽量往“其实是一起做的 / 要查证”上引）</label><textarea id="f_reveal"></textarea></div>
        <div class="ed-acts"><button class="btn-save" id="saveBtn">保存</button><button class="btn-cancel" id="cancelBtn">取消</button></div>
      </div>
      <div class="qlist" id="qlist"></div>
    </div>
  </main>

  <!-- 投屏（全屏，内容按状态渲染）-->
  <div id="present"><div class="pwrap" id="pwrap"></div></div>
</section>

<script>
const $ = s => document.querySelector(s);
const J = (m,u,b)=>fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(r=>r.json().catch(()=>({})).then(d=>({status:r.status,d})));
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60),x=s%60; return m+':'+(x<10?'0':'')+x; }
let publicBase=location.origin;
async function loadPublicBase(){ try{ const {d}=await J('GET','/api/config'); if(d&&d.base) publicBase=d.base.replace(/\/$/,''); }catch(e){} }

/* 登录 */
async function boot(){ await loadPublicBase(); const {d}=await J('GET','/api/me'); if(d&&d.authed) enterApp(); else { $('#login').style.display='flex'; $('#app').style.display='none'; } }
async function doLogin(){ $('#lerr').textContent='';
  const {status,d}=await J('POST','/api/login',{user:$('#u').value,pass:$('#p').value});
  if(status===200&&d.ok) enterApp(); else $('#lerr').textContent=(d&&d.error)||'登录失败';
}
function enterApp(){ $('#login').style.display='none'; $('#app').style.display='block'; loadSettings(); loadQuestions(); startMonitor(); }
$('#loginBtn').addEventListener('click', doLogin);
$('#p').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('#logoutBtn').addEventListener('click', async ()=>{ await J('POST','/api/logout'); location.reload(); });

/* 标签 */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  const tab=t.dataset.tab;
  $('#view-control').style.display = tab==='control'?'block':'none';
  $('#view-bank').style.display = tab==='bank'?'block':'none';
}));

/* —— 控场 —— */
let curState={status:'idle',remaining:0,duration:180}, remaining=0, tick=null;
async function loadSettings(){ const {d}=await J('GET','/api/settings'); if(d&&d.duration){ $('#dur').value=d.duration; } }
document.querySelectorAll('.preset button').forEach(b=>b.addEventListener('click',()=>{ $('#dur').value=b.dataset.sec; saveDuration(); }));
$('#dur').addEventListener('change', saveDuration);
async function saveDuration(){ const v=parseInt($('#dur').value||'180',10); await J('POST','/api/settings',{duration:v}); }
$('#startRound').addEventListener('click', async ()=>{
  const v=parseInt($('#dur').value||'180',10);
  if(!confirm('开始本轮？这会清空上一轮的作答记录，并立刻开始 '+v+' 秒倒计时。')) return;
  await J('POST','/api/round/start',{duration:v}); monitorOnce();
});
$('#endRound').addEventListener('click', async ()=>{ if(!confirm('提前结束本轮，立刻出排名？')) return; await J('POST','/api/round/end'); monitorOnce(); });
$('#resetRound').addEventListener('click', async ()=>{ if(!confirm('重置本轮：清空作答、回到空闲（可重新开始）。')) return; await J('POST','/api/round/reset'); monitorOnce(); });

function startMonitor(){ if(window._mon) clearInterval(window._mon); monitorOnce(); window._mon=setInterval(monitorOnce, 1800);
  if(!tick) tick=setInterval(()=>{ if(curState.status==='running' && remaining>0){ remaining--; paintTime(); } }, 1000); }
async function monitorOnce(){
  const {status,d}=await J('GET','/api/host/monitor'); if(status!==200||!d) return;
  curState=d.state||curState; remaining=(d.state&&typeof d.state.remaining==='number')?d.state.remaining:remaining;
  // 状态条
  const st=$('#stPill'); const map={idle:['空闲',''],running:['进行中','run'],ended:['已结束','end']};
  const m=map[curState.status]||['',''];
  st.textContent=m[0]; st.className='st '+(m[1]||'');
  paintTime();
  // 计数
  $('#cJoined').textContent=d.joined||0; $('#cFin').textContent=d.finished||0; $('#cProg').textContent=d.inprogress||0;
  const nf=d.notFinished||[]; const chips=$('#notfChips');
  $('#notf').innerHTML = nf.length? '<b>'+nf.length+' 人</b>' : '<b>全部完成 🎉</b>';
  chips.innerHTML=''; nf.slice(0,40).forEach(n=>{ const c=document.createElement('span'); c.className='chip'; c.textContent=n; chips.appendChild(c); });
  // 每题
  renderQStats(d.perQuestion||[]);
  // 排名
  renderRank(d.ranking||[], d.state&&d.state.qcount);
  // 投屏内容
  if(document.body.classList.contains('present')) renderPresent(d);
}
function paintTime(){ const cd=$('#cd'); cd.textContent = (curState.status==='running')? fmt(remaining) : (curState.status==='ended'?'结束':'--:--'); cd.classList.toggle('warn', curState.status==='running'&&remaining<=10); }
function renderQStats(list){
  const box=$('#qstats'); box.innerHTML='';
  if(!list.length){ box.innerHTML='<p class="empty">还没有题目。</p>'; return; }
  list.forEach(q=>{
    const tot=q.answered||0; const dh=q.dist.h||0, da=q.dist.a||0, db=q.dist.b||0;
    const pc = tot? Math.round((q.correct/tot)*100) : 0;
    const w=v=> tot? (v/tot*100):0;
    const el=document.createElement('div'); el.className='qstat';
    el.innerHTML =
      '<span class="ord">'+q.ord+'</span>'+
      '<div class="qp"><div class="t">'+esc(q.prompt)+'</div><div class="meta">'+esc(q.round||'')+' · 正解 '+({h:'人',a:'AI',b:'人+AI'}[q.right]||'')+'</div></div>'+
      '<div class="dist"><i class="h" style="width:'+w(dh)+'%"></i><i class="a" style="width:'+w(da)+'%"></i><i class="b" style="width:'+w(db)+'%"></i></div>'+
      '<span class="num">'+tot+' 人答</span>'+
      '<span class="acc">'+(tot?pc+'%':'—')+'</span>';
    box.appendChild(el);
  });
}
function renderRank(rows, qn){
  const box=$('#rankList'); box.innerHTML=''; qn=qn||0;
  if(!rows.length){ box.innerHTML='<p class="empty">还没有人作答。</p>'; return; }
  const medal=['🥇','🥈','🥉'];
  rows.slice(0,20).forEach(r=>{
    const top=r.rank<=3; const div=document.createElement('div'); div.className='row'+(top?(' top t'+r.rank):'');
    const fin = r.finished? '已交卷' : '答题中';
    div.innerHTML='<span class="rk">'+(top?medal[r.rank-1]:r.rank)+'</span><span class="nm">'+esc(r.nick)+'</span>'
      +'<span class="fin">'+fin+'</span><span class="sc">'+r.score+'/'+qn+'</span>';
    box.appendChild(div);
  });
}

/* —— 投屏 —— */
let qrDrawn=false;
function ensureQR(){
  if(qrDrawn) return;
  try{ const qr=qrcode(0,'M'); qr.addData(publicBase+'/'); qr.make();
    const host=$('#pqrbox'); if(host){ host.innerHTML=qr.createSvgTag({cellSize:7,margin:0,scalable:true}); qrDrawn=true; } }catch(e){}
}
function renderPresent(d){
  const s=d.state||curState; const w=$('#pwrap');
  if(s.status==='running'){
    const fin=d.finished||0, jn=d.joined||0; const pct = jn? (fin/jn*100):0;
    w.innerHTML='<div class="pcd'+(remaining<=10?' warn':'')+'">'+fmt(remaining)+'</div>'
      +'<div class="pprog">已交卷 '+fin+' / '+jn+'</div>'
      +'<div class="pbar"><i style="width:'+pct+'%"></i></div>';
  } else if(s.status==='ended'){
    const rows=d.ranking||[]; const qn=(s.qcount||0); const medal=['🥇','🥈','🥉'];
    let html='<div class="ptitle">本轮排名</div><div class="prank">';
    rows.slice(0,10).forEach(r=>{ const top=r.rank<=3;
      html+='<div class="row'+(top?' t'+r.rank:'')+'"><span class="rk">'+(top?medal[r.rank-1]:r.rank)+'</span><span class="nm">'+esc(r.nick)+'</span><span class="sc">'+r.score+'/'+qn+'</span></div>'; });
    if(!rows.length) html+='<div class="empty" style="text-align:center">本轮没有人作答</div>';
    html+='</div>'; w.innerHTML=html;
  } else {
    w.innerHTML='<div class="ptitle">你分得出吗？</div>'
      +'<div class="pqr" id="pqrbox"></div>'
      +'<div class="purl">手机打开 <b>'+esc(publicBase.replace(/^https?:\/\//,''))+'/</b></div>'
      +'<div class="pjoined">已加入 '+(d.joined||0)+' 人 · 等待开始</div>';
    qrDrawn=false; setTimeout(ensureQR,30);
  }
}
function setPresent(on){ document.body.classList.toggle('present',on);
  if(on){ monitorOnce(); if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }
  else if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
}
$('#presentBtn').addEventListener('click',()=>setPresent(true));
$('#presentBtn2').addEventListener('click',()=>setPresent(true));
$('#exitPresent').addEventListener('click',()=>setPresent(false));

/* —— 题库 CRUD（沿用）—— */
let editingId=null; const ANSLBL={h:'人',a:'AI',b:'人+AI'};
async function loadQuestions(){
  const {d}=await J('GET','/api/questions'); const list=(d&&d.questions)||[];
  const box=$('#qlist'); box.innerHTML='';
  list.forEach(q=>{
    const el=document.createElement('div'); el.className='qitem';
    const KMAP={text:'文字',code:'代码',image:'图片',audio:'音频',video:'视频',embed:'嵌入',product:'产品'};
    const icon={image:'🖼',audio:'🎵',video:'🎬',embed:'▶',product:'📦'}[q.kind]||'';
    let preview;
    if(q.kind==='code'||q.kind==='text') preview=q.body||'';
    else if(q.kind==='product') preview=icon+' '+(q.body||q.prompt||'')+(q.link?('  ·  '+q.link):'');
    else preview=icon+' '+(q.media?q.media:'（未设媒体——点编辑补上）');
    el.innerHTML='<div class="qord">'+q.ord+'</div>'+
      '<div class="qmain"><div class="qtop"><span class="qround">'+esc(q.round||'')+'</span>'+
      '<span class="badge '+q.answer+'">'+ANSLBL[q.answer]+'</span><span class="kind">'+esc(KMAP[q.kind]||q.kind)+'</span></div>'+
      '<div class="qprompt">'+esc(q.prompt||'(无题干)')+'</div><div class="qbody">'+esc(preview)+'</div></div>'+
      '<div class="qacts"><button class="mini" data-edit="'+q.id+'">编辑</button><button class="mini del" data-del="'+q.id+'">删除</button></div>';
    box.appendChild(el);
  });
  box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(list.find(x=>x.id==b.dataset.edit))));
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delQuestion(b.dataset.del)));
}
function syncKindUI(){
  const k=$('#f_kind').value; const isMedia=(k==='image'||k==='audio'||k==='video'||k==='embed'); const fileable=(k==='image'||k==='audio'||k==='video'||k==='product');
  $('#mediafield').style.display=(isMedia||k==='product')?'block':'none';
  $('#linkfield').style.display=(k==='product'||k==='embed')?'block':'none';
  $('#uploadrow').style.display=fileable?'flex':'none';
  $('#medialabel').textContent=k==='image'?'图片地址':k==='audio'?'音频地址':k==='video'?'视频地址':k==='embed'?'可嵌入的播放地址（B站/YouTube 等）':'截图地址（可选）';
  $('#bodylabel').textContent=k==='code'?'代码':k==='product'?'产品描述':isMedia?'说明文字（媒体未设时显示为占位）':'正文';
}
$('#f_kind').addEventListener('change', syncKindUI);
$('#f_file').addEventListener('change', async (e)=>{
  const file=e.target.files[0]; if(!file) return; const stat=$('#ustat'); stat.textContent='上传中… '+(file.size/1048576).toFixed(1)+'MB';
  try{ const r=await fetch('/api/upload',{method:'POST',headers:{'X-Filename':encodeURIComponent(file.name)},body:file}); const d=await r.json().catch(()=>({}));
    if(r.status===200&&d.ok){ $('#f_media').value=d.url; stat.textContent='已上传 ✓ '+(d.name||file.name); } else stat.textContent='上传失败：'+((d&&d.error)||('HTTP '+r.status)); }
  catch(err){ stat.textContent='上传失败（请确认已登录、文件未超 300MB）'; } e.target.value='';
});
function openEditor(q){
  editingId=q?q.id:null; $('#edTitle').textContent=q?'编辑题目':'新增一题';
  $('#f_ord').value=q?q.ord:($('#qlist').children.length); $('#f_round').value=q?q.round||'':'';
  $('#f_kind').value=q?q.kind||'text':'text'; $('#f_prompt').value=q?q.prompt||'':'';
  $('#f_body').value=q?q.body||'':''; $('#f_media').value=q?q.media||'':''; $('#f_link').value=q?q.link||'':'';
  $('#f_src').value=q?q.src||'':''; $('#f_answer').value=q?q.answer||'h':'h'; $('#f_reveal').value=q?q.reveal||'':'';
  $('#ustat').textContent=''; syncKindUI(); $('#editor').classList.add('on'); $('#editor').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#newBtn').addEventListener('click',()=>openEditor(null));
$('#cancelBtn').addEventListener('click',()=>$('#editor').classList.remove('on'));
$('#saveBtn').addEventListener('click', async ()=>{
  const payload={ ord:parseInt($('#f_ord').value||'0',10), kind:$('#f_kind').value, round:$('#f_round').value.trim(),
    prompt:$('#f_prompt').value.trim(), body:$('#f_body').value, media:$('#f_media').value.trim(), link:$('#f_link').value.trim(),
    src:$('#f_src').value.trim(), answer:$('#f_answer').value, reveal:$('#f_reveal').value.trim() };
  if(editingId){ await J('PUT','/api/questions/'+editingId,payload); } else { await J('POST','/api/questions',payload); }
  $('#editor').classList.remove('on'); loadQuestions();
});
async function delQuestion(id){ if(!confirm('删除这道题？')) return; await J('DELETE','/api/questions/'+id); loadQuestions(); }
$('#exportBtn').addEventListener('click', async ()=>{
  const {d}=await J('GET','/api/questions'); const items=(d&&d.questions)||[];
  const blob=new Blob([JSON.stringify({questions:items},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='题库备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change', async (e)=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return; if(!confirm('导入会覆盖当前题库，确定继续？')) return;
  try{ const obj=JSON.parse(await file.text()); const items=Array.isArray(obj)?obj:(obj.questions||[]);
    if(!Array.isArray(items)||!items.length){ alert('文件里没有题目'); return; }
    const {status,d}=await J('POST','/api/questions/import',{questions:items});
    if(status===200&&d.ok){ loadQuestions(); alert('已导入 '+d.count+' 题'); } else alert('导入失败：'+((d&&d.error)||('HTTP '+status))); }
  catch(err){ alert('文件解析失败，请确认它是导出的 JSON 备份'); }
});
$('#seedBtn').addEventListener('click', async ()=>{ if(!confirm('恢复为默认题库？这会覆盖你当前的所有题目。')) return; await J('POST','/api/questions/seed'); loadQuestions(); });

boot();
</script>
</body>
</html>
