<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小挑战 · 点亮三颗星</title><body style="margin:40px auto;padding:20px;max-width:600px;background:#fcfbf7;color:#24584c;font:18px/1.8 sans-serif"><p>教程附带的独立小游戏</p><h1>点亮三颗星</h1><p>依次点击三颗星，体验任务完成后的反馈。</p><section id="stars"></section><p id="result">已点亮 0 / 3</p><p>完成后关闭这个标签页，回到原场景点击“返回，继续探索”。</p><script>let count=0;for(let i=0;i<3;i++){const b=document.createElement('button');b.textContent='☆';b.style.cssText='font-size:48px;background:white;border:1px solid #a3b79d;margin:8px;padding:12px;cursor:pointer';b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.textContent='★';b.style.color='#c88e35';count++;document.getElementById('result').textContent=count===3?'完成了！你可以返回原场景。':`已点亮 ${count} / 3`;};document.getElementById('stars').append(b);}</script></body></html>
