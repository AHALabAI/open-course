<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="title desc">
<title id="title">提问、想象、规划、创造、验证、分享、提升的项目循环</title>
<desc id="desc">七个动作围成顺时针环；提升重新连回提问。可以从任一步进入，也可随时回头。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#668575" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
<style>.kicker{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#577262}.headline{font:700 31px 'Microsoft YaHei',sans-serif;fill:#243b32}.caption{font:14px 'Microsoft YaHei',sans-serif;fill:#5b7165}.middle-kicker{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#7d9a85}.middle-title{font:700 25px 'Microsoft YaHei',sans-serif;fill:#2a4b3a}.middle-sub{font:13px 'Microsoft YaHei',sans-serif;fill:#5e7668}.index{font:700 11px Arial,sans-serif;letter-spacing:1px;fill:#a68552}.node-title{font:700 22px 'Microsoft YaHei',sans-serif;fill:#263d31}.node-sub{font:12px 'Microsoft YaHei',sans-serif;fill:#637a6a}</style>
<rect width="900" height="820" fill="#f7f4ec"/>
<text x="48" y="51" class="kicker">AHALAB × MMCOOL / PROJECT STUDIO</text>
<text x="48" y="92" class="headline">从一个问题，到下一次提问</text>
<text x="48" y="119" class="caption">根据 NC State Engineering Design Process 改写的课堂环图</text>
