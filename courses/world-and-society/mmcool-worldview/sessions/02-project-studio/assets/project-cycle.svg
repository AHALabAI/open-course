" fill="#fffdf7" stroke="#94aa98" stroke-width="1.7"/><text x="16" y="25" class="index">03</text><text x="75" y="37" text-anchor="middle" class="node-title">规划</text><text x="75" y="58" text-anchor="middle" class="node-sub">决定先试什么</text></g><g transform="translate(480.7 607.6)"><rect width="152" height="74" rx="13" fill="#fffdf7" stroke="#94aa98" stroke-width="1.7"/><text x="16" y="25" class="index">04</text><text x="75" y="37" text-anchor="middle" class="node-title">创造</text><text x="75" y="58" text-anchor="middle" class="node-sub">做出第一版</text></g><g transform="translate(267.3 607.6)"><rect width="152" height="74" rx="13" fill="#fffdf7" stroke="#94aa98" stroke-width="1.7"/><text x="16" y="25" class="index">05</text><text x="75" y="37" text-anchor="middle" class="node-title">验证</text><text x="75" y="58" text-anchor="middle" class="node-sub">看结果与预期</text></g><g transform="translate(134.2 440.7)"><rect width="152" height="74" rx="13" fill="#f2e4ca" stroke="#a97d3e" stroke-width="1.7"/><text x="16" y="25" class="index">06</text><text x="75" y="37" text-anchor="middle" class="node-title">分享</text><text x="75" y="58" text-anchor="middle" class="node-sub">让别人看见</text></g><g transform="translate(181.7 232.6)"><rect width="152" height="74" rx="13" fill="#fffdf7" stroke="#94aa98" stroke-width="1.7"/><text x="16" y="25" class="index">07</text><text x="75" y="37" text-anchor="middle" class="node-title">提升</text><text x="75" y="58" text-anchor="middle" class="node-sub">改一处再试</text></g>
<line x1="48" y1="758" x2="852" y2="758" stroke="#cbd7ca"/>
<text x="48" y="786" class="caption">验证：结果和预期相符吗？　分享：别人看到了什么？　提升：下一版先改哪里？</text>
</svg>