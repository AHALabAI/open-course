<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ec"><title>小动物园</title><link rel="stylesheet" href="garden.css"></head>
<body><header><a class="brand" href="index.html"><span class="brand-mark">✿</span> AHALAB <span class="crumb">/ 动物养成游戏</span></a><nav><a href="lesson.html">一起做这个游戏</a><button id="sound" aria-pressed="true" aria-label="开关音效">♪ 声音开</button></nav></header>
<main><div class="heading"><div><p class="eyebrow">喂一喂 · 玩一玩 · 找新朋友</p><h1>小动物园</h1><p class="intro">小猫在等你。先给它起个名字吧。</p></div><div class="totals"><span><b id="friend-count">1</b> / 12<br>动物朋友</span><span><b id="care-count">0</b><br>照顾次数</span></div></div>
<div class="game-layout"><aside class="maps"><h2>去哪里玩？</h2><div id="map-list"></div><div class="map-tip" id="unlock-tip"></div><p class="save-note" id="save-note">进度保存在这台设备的浏览器里。</p></aside>
<section class="play-area" aria-label="动物活动区"><div class="scene-top"><div><span id="place-label">01 / 晴天草地</span><h2 id="scene-title">和小猫待一会儿</h2></div><div class="mode-switch" aria-label="玩法"><button id="home-mode" aria-pressed="true">照顾动物</button><button id="explore-mode" aria-pressed="false">找动物 <span>⌕</span></button></div></div>
<div id="scene" class="scene meadow"><div class="sun"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="hill hill-back"></div><div class="hill hill-front"></div><div class="pond"></div><div class="path"></div><div class="flowers" aria-hidden="true">✿ <i>✿</i> ✿ <i>✿</i></div><div id="search-spots"></div><div id="pet-stage"><div class="pet-shadow"></div><button id="pet-body" aria-label="摸摸小猫"></button><div id="food" aria-hidden="true"></div><div id="ball" aria-hidden="true"></div><div id="sparkles" aria-hidden="true"><span>♥</span><span>✦</span><span>♥</span></div></div><div id="scene-hint">点点小猫，跟它打个招呼</div></div>
<div class="message" role="status" aria-live="polite" id="message">这是你的第一位动物朋友。它还没有名字呢。</div></section>
<aside class="care-panel"><p class="eyebrow" id="species-label">我的小猫</p><h2 id="pet-name">小猫</h2><form id="name-form"><label for="name-input">给它起个名字</label><div class="name-row"><input id="name-input" maxlength="12" placeholder="最多12个字" autocomplete="off"><button type="submit">叫这个</button></div></form><div class="stat"><span>肚子饱不饱 <b id="full-text"></b></span><progress id="full" max="100" value="40"></progress></div><div class="stat mood"><span>开不开心 <b id="happy-text"></b></span><progress id="happy" max="100" value="45"></progress></div><div class="bond"><span>我们有多熟？</span><b id="bond" aria-label="熟悉程度"></b></div><button class="action feed" id="feed"><span>◒</span> 喂它吃东西 <small id="food-label">小猫粮</small></button><button class="action play" id="play"><span>◉</span> 陪它玩球 <small>看看它怎么跳</small></button><p class="gentle">离开游戏也没关系，小动物会等你回来。</p></aside></div>
<section class="collection"><div class="collection-head"><div><p class="eyebrow">找到的朋友都在这里</p><h2>我的小动物</h2></div><p>点一只，陪它玩一会儿</p></div><div id="animal-list"></div></section>
<footer><span>动物养成游戏 · 动物动作与食物为游戏示意</span><div><button id="reset">重新开始</button><button id="cancel-reset" hidden>先不重来</button><a href="lesson.html">一起做这个游戏 ↗</a></div></footer></main><script type="module" src="garden.mjs"></script></body></html>
