<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>布景与道具 · AHALab</title><link href="course.css" rel="stylesheet"/><link href="app/course-watermark.css" rel="stylesheet"/><script data-shadow-i18n="" src="i18n/ui.mjs" type="module"></script><link data-shadow-i18n="" href="i18n/style.css" rel="stylesheet"/></head><body><header class="top"><a class="brand" href="index.html"><img alt="AHALab" height="38" src="assets/brand/AHALab-logo.png" width="38"/>AHALab</a><nav><a href="index.html">课程首页</a><a href="classroom.html">教师备课</a><a href="https://mp.weixin.qq.com/s/sBJoPbetgkh9iIuMOeFJxA" rel="noopener" target="_blank">了解“手指皮影戏”课程 ↗</a></nav><label class="shadow-language">Language <select aria-label="Language" data-shadow-language=""><option selected="" value="zh-CN">简体中文</option><option value="en">English</option><option value="ru">Русский</option><option value="fr">Français</option><option value="es">Español</option><option value="ar">العربية</option><option value="ja">日本語</option><option value="de">Deutsch</option><option value="ko">한국어</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="pt">Português</option><option value="ur">اردو</option><option value="fi">Suomi</option><option value="da">Dansk</option><option value="nl">Nederlands</option></select></label></header><main><h1>布景与道具</h1><p>在剧场选择背景，摆上花灯、仙桃、桌子或桥。先让人物接近物件，收拢手指拿起，张手放下。鼠标模式可以选人物后使用拿起、放下按钮。</p><p>两位角色交接时，先放下，再由同伴拿起。手短暂被挡住时，人物与道具先维持归属；回来分不清，可手动绑定原角色。</p><p>手动修改布景后，程序保留你的安排。英语剧场与语文任务也可从对应入口带入角色和道具。</p><a href="app/index.html">进剧场试一试 ↗</a></main><footer>研发 · AHALab X ZimaBlueAI <a href="license.html">许可与来源</a></footer></body></html>
