<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><title>手指皮影戏 · 桌面舞台</title><style>html,body{margin:0;width:100%;height:100%;overflow:clip;background:transparent}canvas{width:100%;height:100%;display:block}</style><script data-shadow-i18n="" src="../i18n/ui.mjs" type="module"></script><link data-shadow-i18n="" href="../i18n/style.css" rel="stylesheet"/></head><body><canvas id="overlay"></canvas><script type="module">
import {drawPuppet} from './puppet.mjs';
import {receiveDesign} from './custom-puppet.mjs';
import {ScenePainter} from './scene-view.mjs';
const scenery=new ScenePainter();let scene=[];
const canvas=document.getElementById('overlay'),ctx=canvas.getContext('2d'),channel=new BroadcastChannel('finger-shadow-v01');let poses=[],last=0;
channel.onmessage=({data})=>{if(data.type==='design'){try{receiveDesign(data.design);}catch{}return;}if(data.type==='poses'){poses=data.puppets;scene=Array.isArray(data.scene)?data.scene:[];last=performance.now();window.shadowCount=poses.length;}};
function render(now){const w=innerWidth,h=innerHeight,dpr=devicePixelRatio;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);if(now-last<800){scenery.props(ctx,scene,w,h,now);const actors=poses.map(p=>({...p,grips:drawPuppet(ctx,p,w,h)?.grips}));scenery.props(ctx,scene,w,h,now,{front:true,actors});}requestAnimationFrame(render);}requestAnimationFrame(render);
</script><label class="shadow-language">Language <select aria-label="Language" data-shadow-language=""><option selected="" value="zh-CN">简体中文</option><option value="en">English</option><option value="ru">Русский</option><option value="fr">Français</option><option value="es">Español</option><option value="ar">العربية</option><option value="ja">日本語</option><option value="de">Deutsch</option><option value="ko">한국어</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="pt">Português</option><option value="ur">اردو</option><option value="fi">Suomi</option><option value="da">Dansk</option><option value="nl">Nederlands</option></select></label></body></html>
