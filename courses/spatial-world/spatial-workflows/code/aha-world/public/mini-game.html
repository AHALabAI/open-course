<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索工坊 · 信号收集</title>
<style>body{margin:0;background:#eef1df;color:#203d32;font:18px system-ui;text-align:center}main{max-width:700px;margin:10vh auto;padding:24px}h1{font-size:36px}#field{height:280px;position:relative;background:#cbded1;border-radius:20px;margin:24px 0}button{cursor:pointer;border:0;border-radius:12px;padding:14px;background:#24634c;color:white;font:inherit}#field button{position:absolute;font-size:36px;background:#e7b449;color:#203d32}a{color:inherit}</style>
<main><p>AHALab · 本地小游戏</p><h1 id="title">收集三枚信号</h1><p>点击光点，接住每一个新发现。</p><div id="field"></div><p id="status" role="status">已找到 0 / 3</p><button id="restart">重新开始</button><p>完成后切回工坊标签页，点击“返回 AHA”。</p><a href="/">打开工坊首页</a></main>
<script>const field=document.querySelector('#field'),status=document.querySelector('#status');let count=0;const theme=new URLSearchParams(location.search).get('theme');document.querySelector('#title').textContent=({sea:'点亮三座航标',pond:'找到三尾小鱼',signal:'接通三枚信号'})[theme]||'收集三枚信号';function start(){count=0;status.textContent='已找到 0 / 3';field.replaceChildren();for(let i=0;i<3;i++){const b=document.createElement('button');b.textContent=theme==='pond'?'鱼':'✦';b.setAttribute('aria-label','收集第 '+(i+1)+' 枚');b.style.left=(12+i*28)+'%';b.style.top=(30+(i%2)*90)+'px';b.onclick=()=>{b.disabled=true;b.hidden=true;status.textContent=++count===3?'完成！返回工坊继续探索。':`已找到 ${count} / 3`;};field.append(b);}}document.querySelector('#restart').onclick=start;start();</script></html>
