<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>办公室实际 GLB 展示动画</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eefaf2;font-family:'Microsoft YaHei',Arial;overflow:hidden}canvas{display:block;width:1280px;height:720px}header{position:absolute;top:0;left:0;right:0;padding:20px 32px 24px;background:linear-gradient(#0b1220ef,#0b1220b0,transparent);pointer-events:none}small{color:#86efac;font:14px Consolas,monospace;letter-spacing:1px}h1{font-size:30px;line-height:1.4;margin:8px 0 4px;font-weight:650}footer{position:absolute;bottom:0;left:0;right:0;background:#0b1220e8;border-top:1px solid #335548;padding:15px 32px;display:flex;gap:25px;justify-content:space-between;font-size:16px;line-height:1.5}#note{max-width:890px}#progress{position:absolute;bottom:0;left:0;height:3px;background:#22c55e}</style><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body><header><small id="eyebrow"></small><h1 id="heading"></h1></header><footer><span id="note"></span><span>Meta / office1a · 公开素材</span></footer><section id="progress"></section><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1280,720);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#182329');scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);const camera=new THREE.PerspectiveCamera(70,1280/720,.01,1000),loader=new GLTFLoader(),models={};
for(const [key,file] of Object.entries({original:'office-room-final.glb',final:'office-envelope-final.glb',overlay:'envelope-overlay.glb'})){
 const object=(await loader.loadAsync('assets/'+file)).scene;object.traverse(o=>{if(!o.isMesh)return;if(key==='overlay'){o.material=new THREE.MeshBasicMaterial({color:0xff7628,side:THREE.DoubleSide,transparent:true,opacity:.65,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3,depthWrite:false});o.renderOrder=2;return;}const convert=m=>{if(m.name.startsWith('replacement_')){m.side=THREE.DoubleSide;return m;}return new THREE.MeshBasicMaterial({map:m.map,color:m.color,side:THREE.DoubleSide});};o.material=Array.isArray(o.material)?o.material.map(convert):convert(o.material);});scene.add(object);models[key]=object;
}models.overlay.getObjectByName('inferred_tabletop').visible=false;models.overlay.getObjectByName('inferred_walls').visible=false;
const clamp=t=>Math.max(0,Math.min(1,t)),smooth=t=>{t=clamp(t);return t*t*(3-2*t)},lerp=(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t);
window.renderFilm=t=>{
 t=Math.max(0,Math.min(50,t));let pos,target,fov=70,kind='final',overlay=false,title,note,chapter;

 if(t<4){const u=smooth(t/4);pos=lerp([1.73,1.48,1.49],[1.59,1.34,1.35],u);target=[-.1,.85,0];title='把真实空间搬进 3D';note='公开照片重建＋规则补建 · 实际 GLB 渲染 · 音乐：Revealing the Form';chapter='01 / REVEALING THE FORM';}
 else if(t<10){pos=[0,1.18,.95];target=[1.8,2.02,-1.4];fov=94;kind=t<7?'original':'final';title=t<7?'墙顶精修前：起伏、碎面与照片重影':'墙顶精修后：平整结构，清理遮挡重影';note='相同镜头对照 · 7 个平面补建四面墙、天花板与柱角；属于推断几何';chapter='02 / BEFORE → AFTER';}
 else if(t<22){const angle=Math.PI/4+(t-10)/12*Math.PI*2;pos=[-.1+1.78*Math.cos(angle),1.48+.08*Math.sin((t-10)/12*Math.PI),1.35*Math.sin(angle)];target=[-.1,.80,0];fov=76;title='在模型里绕行一周';note='椅子、桌板、屏幕与部分桌上物件为近似补建 · 扫描原件与历次版本保留';chapter='03 / ORBIT';}
 else if(t<28){const u=smooth((t-22)/6);pos=lerp([.2,1.20,.25],[-.15,1.20,.1],u);target=[0,2.435,-.2];fov=104;title='天花板：平面约束＋多视角照片投影';note='消除扫描起伏；灯板与小型顶面设施以平面照片外观呈现，没有完整实体细节';chapter='04 / CEILING';}
 else if(t<34){const u=smooth((t-28)/6);pos=lerp([0,1.3,.9],[-.2,1.35,.3],u);target=[2.485,1.45,-.2];fov=82;title='墙面与柱角：保留文字，补齐结构';note='保留公开原片中的可见文字；被遮挡与重影区域使用推断材质，不能当作实测结果';chapter='05 / WALLS & CORNER';}
 else if(t<39){const u=smooth((t-34)/5);pos=lerp([-.99,1.42,.80],[.55,1.35,.90],u);target=[-.28,.82,-.02];fov=62;title='桌面：规则几何与原照片外观结合';note='桌面、椅子和物件沿用上一轮修复；本轮逐项校验独立网格未改变';chapter='06 / OBJECTS';}
 else if(t<44){const u=smooth((t-39)/5);pos=lerp([.90,1.26,-.55],[1.56,1.18,-.28],u);target=[1.41,1.085,2.005];fov=62;title='门框与玻璃：形状补建，照片烘焙';note='玻璃使用固定照片外观；尚未实现门后透视、开门动作或碰撞';chapter='07 / PHOTO-BAKED DOOR';}
 else if(t<47){pos=[1.6,1.40,1.38];target=[-.05,1.15,0];fov=82;overlay=true;title='橙色标记：这些部分是推断补建';note='观测证据与补建结构分别保存 · 未观察到的区域不冒充真实扫描';chapter='08 / INFERRED GEOMETRY';}
 else {pos=[1.6,1.40,1.38];target=[-.05,.73,0];fov=70;title='118,959 个三角面 · 33.8 MiB · 自包含 GLB';note='可交互查看的混合三维资产 · 尺寸、碰撞与真实手机／无人机采集仍需后续验证';chapter='09 / EXPORT VERIFIED';}

 models.original.visible=kind==='original';models.final.visible=kind==='final';models.overlay.visible=overlay;camera.position.fromArray(pos);camera.up.set(0,1,0);camera.lookAt(new THREE.Vector3(...target));camera.fov=fov;camera.updateProjectionMatrix();renderer.render(scene,camera);
 document.querySelector('#eyebrow').textContent='AHA LAB / '+chapter;document.querySelector('#heading').textContent=title;document.querySelector('#note').textContent=note;document.querySelector('#progress').style.width=(t/50*100)+'%';return {time:t,chapter,variant:kind,overlay,camera:pos,target,fov};
};window.renderFilm(0);window.filmReady=true;
</script></body></html>
